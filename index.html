<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>고양이를 찾아서</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="overlay">
      <div id="stage-title"></div>
      <div id="hint"></div>
      <div id="flash"></div>
      <div id="narration"></div>

      <div id="title-screen">
        <h1 data-i18n="game.title"></h1>
        <p class="sub" data-i18n="game.sub"></p>

        <!-- 언어 선택 : 눌러서 고르거나 ← → 로 넘긴다 -->
        <div id="lang">
          <span class="label" data-i18n="title.lang"></span>
          <span class="opts">
            <button type="button" data-lang="ko">한국어</button>
            <span class="sep">/</span>
            <button type="button" data-lang="en">ENGLISH</button>
          </span>
        </div>

        <p class="blink">
          <span class="k" data-i18n="title.startKey"></span>
          <span class="t" data-i18n="title.startTouch"></span>
        </p>
        <p class="ctrl">
          <span class="k" data-i18n="title.ctrlKeys"></span>
          <span class="t" data-i18n="title.ctrlTouch"></span>
          &nbsp;·&nbsp;
          <span data-i18n="title.sound"></span>
        </p>
      </div>
    </div>
  </div>

  <!-- 휴대폰 조작 : 터치 기기에서만 켜진다 -->
  <div id="touch" hidden>
    <div id="stick-hint"></div>
    <div id="stick"></div>
    <div id="knob"></div>
    <div id="btn-act">E</div>
  </div>

  <!-- 세로로 들고 있을 때 -->
  <div id="rotate">
    <div class="phone"></div>
    <p data-i18n="rotate"></p>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/props.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/touch.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
